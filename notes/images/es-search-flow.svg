<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #1f6feb; stroke: #58a6ff; stroke-width: 2; }
      .text { fill: #e6edf3; font-family: Arial, sans-serif; font-size: 13px; }
      .title { font-weight: bold; font-size: 14px; }
      .step { fill: #a371f7; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .number { font-weight: bold; font-size: 12px; fill: white; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" class="text title" text-anchor="middle" style="font-size: 16px;">Complete Elasticsearch Search Flow</text>

  <!-- Step 1 -->
  <circle cx="100" cy="70" r="18" class="step" />
  <text x="100" y="76" class="number" text-anchor="middle">1</text>
  <rect x="130" y="50" width="250" height="40" class="box" rx="5" />
  <text x="255" y="72" class="text title" text-anchor="middle">User Query</text>
  <text x="255" y="85" class="text" text-anchor="middle">"virat kohli"</text>
  <path d="M 100 88 L 100 130" class="arrow" />

  <!-- Step 2 -->
  <circle cx="100" cy="170" r="18" class="step" />
  <text x="100" y="176" class="number" text-anchor="middle">2</text>
  <rect x="130" y="150" width="250" height="40" class="box" rx="5" />
  <text x="255" y="172" class="text title" text-anchor="middle">Term Dictionary Lookup</text>
  <text x="255" y="185" class="text" text-anchor="middle">Find "virat" and "kohli"</text>
  <path d="M 100 188 L 100 230" class="arrow" />

  <!-- Step 3 -->
  <circle cx="100" cy="270" r="18" class="step" />
  <text x="100" y="276" class="number" text-anchor="middle">3</text>
  <rect x="130" y="250" width="250" height="40" class="box" rx="5" />
  <text x="255" y="272" class="text title" text-anchor="middle">Get Postings Lists</text>
  <text x="255" y="285" class="text" text-anchor="middle">Candidate documents</text>
  <path d="M 100 288 L 100 330" class="arrow" />

  <!-- Step 4 -->
  <circle cx="100" cy="370" r="18" class="step" />
  <text x="100" y="376" class="number" text-anchor="middle">4</text>
  <rect x="130" y="350" width="250" height="40" class="box" rx="5" />
  <text x="255" y="372" class="text title" text-anchor="middle">Intersect Postings</text>
  <text x="255" y="385" class="text" text-anchor="middle">Narrow down documents</text>
  <path d="M 100 388 L 100 430" class="arrow" />

  <!-- Step 5 -->
  <circle cx="100" cy="470" r="18" class="step" />
  <text x="100" y="476" class="number" text-anchor="middle">5</text>
  <rect x="130" y="450" width="250" height="40" class="box" rx="5" />
  <text x="255" y="472" class="text title" text-anchor="middle">Position Verification</text>
  <text x="255" y="485" class="text" text-anchor="middle">Check phrase match</text>
  <path d="M 100 488 L 100 530" class="arrow" />

  <!-- Step 6 -->
  <circle cx="100" cy="570" r="18" class="step" />
  <text x="100" y="576" class="number" text-anchor="middle">6</text>
  <rect x="130" y="550" width="250" height="40" class="box" rx="5" />
  <text x="255" y="572" class="text title" text-anchor="middle">BM25 Scoring & Ranking</text>
  <text x="255" y="585" class="text" text-anchor="middle">Calculate relevance</text>
  <path d="M 100 588 L 100 630" class="arrow" />

  <!-- Step 7 -->
  <circle cx="100" cy="670" r="18" class="step" />
  <text x="100" y="676" class="number" text-anchor="middle">7</text>
  <rect x="130" y="650" width="250" height="40" class="box" rx="5" />
  <text x="255" y="672" class="text title" text-anchor="middle">Return Results</text>
  <text x="255" y="685" class="text" text-anchor="middle">Ranked docs + highlighting</text>

  <!-- Right side: Details -->
  <text x="420" y="80" class="text title">Details:</text>

  <!-- 1 Details -->
  <rect x="420" y="95" width="350" height="65" class="box" rx="5" />
  <text x="430" y="115" class="text title">1. Query Input</text>
  <text x="430" y="135" class="text">User enters search query</text>
  <text x="430" y="150" class="text">Example: "virat kohli"</text>

  <!-- 2 Details -->
  <rect x="420" y="170" width="350" height="65" class="box" rx="5" />
  <text x="430" y="190" class="text title">2-3. Index Lookup</text>
  <text x="430" y="210" class="text">Search term dictionary</text>
  <text x="430" y="225" class="text">Get postings lists (Doc IDs)</text>

  <!-- 4 Details -->
  <rect x="420" y="245" width="350" height="65" class="box" rx="5" />
  <text x="430" y="265" class="text title">4. Set Intersection</text>
  <text x="430" y="285" class="text">Combine postings: PostList1 ∩ PostList2</text>
  <text x="430" y="300" class="text">Result: candidate documents</text>

  <!-- 5 Details -->
  <rect x="420" y="320" width="350" height="65" class="box" rx="5" />
  <text x="430" y="340" class="text title">5. Position Check</text>
  <text x="430" y="360" class="text">Verify tokens are adjacent</text>
  <text x="430" y="375" class="text">Phrase matching validation</text>

  <!-- 6 Details -->
  <rect x="420" y="395" width="350" height="65" class="box" rx="5" />
  <text x="430" y="415" class="text title">6. Relevance Scoring</text>
  <text x="430" y="435" class="text">BM25 algorithm scores</text>
  <text x="430" y="450" class="text">Consider: frequency, rarity</text>

  <!-- 7 Details -->
  <rect x="420" y="470" width="350" height="90" class="box" rx="5" />
  <text x="430" y="490" class="text title">7. Final Results</text>
  <text x="430" y="510" class="text">Sort by score (high to low)</text>
  <text x="430" y="525" class="text">Retrieve original JSON (_source)</text>
  <text x="430" y="540" class="text">Add highlighting info</text>
  <text x="430" y="555" class="text">Return to user</text>
</svg>
